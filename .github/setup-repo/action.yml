name: Setup Repository
description: Sets up the repository with necessary tools.

inputs:
  mise-install-args:
    description: >-
      Tools for mise to install (passed to `mise install`), for example
      `cargo:nur`. Empty installs everything the repository's mise config
      names.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust toolchain from rust-toolchain.toml
      shell: bash
      run: rustup show active-toolchain
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # zizmor: ignore[cache-poisoning]
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@4b6fa09d0d1ef9740a0c332e31b9ae336f97efa0 # v1.28.0
    # mise-action exports MISE_TRUSTED_CONFIG_PATHS (the workspace) for later
    # steps, so the repository's mise config (with its [settings]) loads.
    - name: Setup tooling with mise
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        install_args: ${{ inputs.mise-install-args }}
        # No cache for tag builds (release artifacts; cache poisoning).
        cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        # token just used for auth (rate limit increase)
        GITHUB_TOKEN: ${{ github.token }}
