# `nur ci` on each OS. Called from a repository's CI:
#   uses: lsdocs/.github/.github/workflows/ci.yml@<ref>
name: ci

on:
  workflow_call:
    inputs:
      os:
        description: Runners to run on, as a JSON list.
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      apt-packages:
        description: >-
          Packages to install with apt on Linux before setup, separated by
          spaces (for example `libclang-dev`).
        type: string
        default: ""
      msvc-dev-cmd:
        description: >-
          On Windows, load an MSVC developer prompt (ilammy/msvc-dev-cmd)
          before `nur ci`; for example for mlua's vendored LuaJIT.
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Install apt packages
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        shell: bash
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        # Word splitting on purpose: one argument per package.
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows' && inputs.msvc-dev-cmd
      - uses: lsdocs/.github/.github/setup-repo@main
      - run: nur ci
