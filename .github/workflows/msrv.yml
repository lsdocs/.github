# Each crate on its own rust-version (`nur msrv` installs the toolchains).
# Called from a repository's CI:
#   uses: lsdocs/.github/.github/workflows/msrv.yml@<ref>
name: msrv

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: lsdocs/.github/.github/setup-repo@setup-reusable-ci
        with:
          mise-install-args: cargo:nur
      - run: nur msrv
