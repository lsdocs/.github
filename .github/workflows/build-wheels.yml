# Builds a Python package's wheels (maturin; --zig on Linux except ppc64le)
# and its sdist. Each target gets two wheels: the stable ABI for Python 3.11
# and later (`pyo3/abi3-py311`), and the free-threaded stable ABI for 3.15
# and later (`pyo3/abi3t-py315`). Uploads `wheels-<target>-<abi>` and
# `sdist`, then checks them all with `twine check --strict`. Publishes
# nothing.
#   uses: lsdocs/.github/.github/workflows/build-wheels.yml@<ref>
name: build-wheels

on:
  workflow_call:
    inputs:
      working-directory:
        description: The Python package's directory (its pyproject.toml).
        type: string
        required: true
      targets:
        description: Target triples, as a JSON list.
        type: string
        default: >-
          ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
          "x86_64-apple-darwin", "aarch64-apple-darwin",
          "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
          "x86_64-unknown-linux-musl"]

permissions: {}

jobs:
  wheels:
    name: wheels (${{ matrix.target }}, ${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
        abi: [abi3-py311, abi3t-py315]
    # Windows on ARM builds on an ARM runner (with an arm64 Python).
    runs-on: >-
      ${{ startsWith(matrix.target, 'aarch64-pc-windows') && 'windows-11-arm'
      || contains(matrix.target, 'windows') && 'windows-latest'
      || contains(matrix.target, 'apple') && 'macos-latest'
      || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: lsdocs/.github/.github/setup-repo@main
        with:
          mise-install-args: cargo:nur
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: startsWith(matrix.target, 'aarch64-pc-windows')
        with:
          python-version: ${{ matrix.abi == 'abi3t-py315' && '3.15' || '3.11' }}
          freethreaded: ${{ matrix.abi == 'abi3t-py315' }}
          architecture: arm64
      # On Linux, zig cross-compiles on the host (manylinux/musllinux tags
      # without a container), except ppc64le, which builds in maturin's
      # manylinux container.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ inputs.working-directory }}
          target: ${{ matrix.target }}
          manylinux: ${{ contains(matrix.target, 'musl') && 'musllinux_1_2' || 'auto' }}
          container: >-
            ${{ contains(matrix.target, 'linux')
            && !startsWith(matrix.target, 'powerpc64le') && 'off' || '' }}
          args: >-
            --release --locked --out dist
            --features pyo3/${{ matrix.abi }}
            ${{ contains(matrix.target, 'linux')
            && !startsWith(matrix.target, 'powerpc64le') && '--zig' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.abi }}
          path: ${{ inputs.working-directory }}/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: lsdocs/.github/.github/setup-repo@main
        with:
          mise-install-args: cargo:nur
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ inputs.working-directory }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: ${{ inputs.working-directory }}/dist/*.tar.gz
          if-no-files-found: error

  # The dists as PyPI will see them: metadata, and the long description
  # renders.
  check:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: pipx run twine check --strict dist/*
