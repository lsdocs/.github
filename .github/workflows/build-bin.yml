# Builds a crate's binary for each target and archives it with the LICENSE
# files (.zip on Windows, .tar.gz elsewhere), as cargo-binstall expects.
# Uploads one artifact per target, `bin-<target>`. Publishes nothing.
#   uses: lsdocs/.github/.github/workflows/build-bin.yml@<ref>
name: build-bin

on:
  workflow_call:
    inputs:
      package:
        description: The package to build; its binary has the same name.
        type: string
        required: true
      targets:
        description: Target triples, as a JSON list.
        type: string
        default: >-
          ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
          "x86_64-apple-darwin", "aarch64-apple-darwin",
          "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
          "x86_64-unknown-linux-musl"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: >-
      ${{ contains(matrix.target, 'windows') && 'windows-latest'
      || contains(matrix.target, 'apple') && 'macos-latest'
      || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: lsdocs/.github/.github/setup-repo@main
        with:
          mise-install-args: cargo:nur
      # Linux: cross (cross-rs), for older-glibc compatibility.
      - name: Build (cross)
        if: contains(matrix.target, 'linux')
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ matrix.target }}
        run: >-
          mise exec cargo:cross@latest --
          cross build --release --locked
          -p "$PACKAGE" --target "$TARGET"
      - name: Build (cargo)
        if: ${{ !contains(matrix.target, 'linux') }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked -p "$PACKAGE" --target "$TARGET"
      - name: Archive
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist staging
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/$PACKAGE.exe" LICENSE-APACHE LICENSE-MIT staging/
            (cd staging && 7z a -tzip "../dist/$PACKAGE-$TARGET.zip" ./*)
          else
            cp "target/$TARGET/release/$PACKAGE" LICENSE-APACHE LICENSE-MIT staging/
            tar -czf "dist/$PACKAGE-$TARGET.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
