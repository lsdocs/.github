# Builds a Lua module made with mlua: the library per target and Lua
# version (`--no-default-features --features <lua>,module`; Linux targets
# with cross, for older-glibc compatibility, as build-bin.yml), renamed to
# what `require` loads, loaded in that Lua as a smoke test on a runner of
# its target, and packed. The rockspec is written from a template
# (`@VERSION@` replaced, and `@SHA256@` by one `["<lua>-<target>"] =
# "<hash>",` line per archive, for luarocks-build-lsdocs-prebuilt) and
# checked with `luarocks lint`; then it is installed with that backend in
# Lua 5.4 and LuaJIT (from local files, so before any release exists), and
# once from source. Uploads `rock-<target>-<lua>` and `rockspec` (the
# rockspec and SHA256SUMS). Publishes nothing.
#
# The crate needs features `lua54`, `luajit` and `module` (each enabling
# mlua's own).
#   uses: lsdocs/.github/.github/workflows/build-rocks.yml@<ref>
name: build-rocks

on:
  workflow_call:
    inputs:
      working-directory:
        description: The binding crate's directory (its Cargo.toml).
        type: string
        required: true
      crate:
        description: The binding crate's package name (cargo -p).
        type: string
        required: true
      library:
        description: The crate's library name (its [lib] name).
        type: string
        required: true
      module:
        description: The name `require` loads (the luaopen_<module> symbol).
        type: string
        required: true
      rockspec:
        description: >-
          The rockspec template, relative to working-directory; @VERSION@
          becomes the crate's version.
        type: string
        required: true
      version:
        description: The version the rockspec gets (the binding crate's).
        type: string
        required: true
      targets:
        description: Target triples, as a JSON list.
        type: string
        # Windows modules bind lua54.dll / lua51.dll by name (mlua's
        # raw-dylib linking: no Lua library needed to build them).
        default: >-
          ["x86_64-pc-windows-msvc",
          "x86_64-apple-darwin", "aarch64-apple-darwin",
          "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
      lua-versions:
        description: >-
          Lua versions, as a JSON list of the crate's features (lua54,
          luajit).
        type: string
        default: '["lua54", "luajit"]'
      lua54-tool:
        description: >-
          The mise tool that runs the lua54 modules (`lua`; it also brings
          LuaRocks, for the rockspec check).
        type: string
        default: lua@5.4.9
      luajit-tool:
        description: The mise tool that runs the luajit modules (`luajit`).
        type: string
        default: conda:luajit@2.1.1744318430
      windows-lua54:
        description: >-
          setup-lua's lua-version for the Windows lua54 smoke test (an MSVC
          build with lua54.dll).
        type: string
        default: "5.4.8"
      windows-luajit:
        description: >-
          setup-lua's lua-version for the Windows luajit smoke test (an
          MSVC build with lua51.dll).
        type: string
        default: luajit
      backend-ref:
        description: >-
          The lsdocs/.github ref whose luarocks-build-lsdocs-prebuilt the
          install test uses.
        type: string
        default: main

permissions: {}

jobs:
  module:
    name: module (${{ matrix.target }}, ${{ matrix.lua }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
        lua: ${{ fromJSON(inputs.lua-versions) }}
    # Linux: cross-built on x86_64 (cross-rs, for older-glibc
    # compatibility); the aarch64 modules are loaded by `load-linux-arm`.
    # Every other module is loaded by a Lua of its target here, except x86_64
    # macOS, built on an ARM runner (no smoke test).
    runs-on: >-
      ${{ contains(matrix.target, 'windows') && 'windows-latest'
      || contains(matrix.target, 'apple') && 'macos-latest'
      || 'ubuntu-latest' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: lsdocs/.github/.github/setup-repo@main
        with:
          mise-install-args: cargo:nur
      # The interpreter for the smoke test, from mise (Lua is built from
      # source; LuaJIT comes from conda-forge).
      - name: Install Lua
        if: >-
          matrix.target != 'x86_64-apple-darwin'
          && !contains(matrix.target, 'windows')
          && !startsWith(matrix.target, 'aarch64-unknown-linux')
        env:
          LUA_TOOL: ${{ matrix.lua == 'luajit' && inputs.luajit-tool || inputs.lua54-tool }}
          # The conda backend is experimental in mise.
          MISE_EXPERIMENTAL: "1"
        run: mise install "$LUA_TOOL"
      # Linux: cross (cross-rs), in an image with an older glibc than the
      # runner's, so the modules load on older distributions too (as
      # build-bin.yml's binaries). Module mode links no Lua library.
      - name: Build the module (cross)
        if: contains(matrix.target, 'linux')
        env:
          TARGET: ${{ matrix.target }}
          LUA: ${{ matrix.lua }}
          CRATE: ${{ inputs.crate }}
        run: >-
          mise exec cargo:cross@latest --
          cross build --release --locked -p "$CRATE" --target "$TARGET"
          --no-default-features --features "$LUA,module"
      - name: Add the target
        if: ${{ !contains(matrix.target, 'linux') }}
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build the module
        if: ${{ !contains(matrix.target, 'linux') }}
        env:
          TARGET: ${{ matrix.target }}
          LUA: ${{ matrix.lua }}
          CRATE: ${{ inputs.crate }}
          # macOS: the Lua symbols come from the interpreter at load time.
          RUSTFLAGS: >-
            ${{ contains(matrix.target, 'apple')
            && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}
        # Windows: no LUA_LIB_NAME, so mlua binds the Lua DLL by name
        # (raw-dylib) instead of linking an import library.
        run: >-
          env -u LUA_LIB_NAME -u LUA_LIB
          cargo build --release --locked -p "$CRATE" --target "$TARGET"
          --no-default-features --features "$LUA,module"
      - name: Stage the module
        env:
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ inputs.library }}
          MODULE: ${{ inputs.module }}
        run: |
          mkdir -p dist/lib
          # LuaRocks installs C modules as .so on macOS too, .dll on Windows.
          case "$TARGET" in
            *windows*) cp "target/$TARGET/release/$LIBRARY.dll" "dist/lib/$MODULE.dll" ;;
            *apple*) cp "target/$TARGET/release/lib$LIBRARY.dylib" "dist/lib/$MODULE.so" ;;
            *) cp "target/$TARGET/release/lib$LIBRARY.so" "dist/lib/$MODULE.so" ;;
          esac
      # Windows: an MSVC Lua 5.4 (lua54.dll) or LuaJIT (lua51.dll), the DLL
      # names the module binds, for the smoke test. In .lua, on PATH.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: contains(matrix.target, 'windows')
      - uses: luau-project/setup-lua@95a68882fb62b1b14c936e15c4d67128e77281f7 # v3.0.0
        if: contains(matrix.target, 'windows')
        with:
          lua-version: ${{ matrix.lua == 'luajit' && inputs.windows-luajit || inputs.windows-lua54 }}
          # A tag build: no cache (cache poisoning).
          use-cache: "false"
      - name: Load the module
        if: >-
          matrix.target != 'x86_64-apple-darwin'
          && !startsWith(matrix.target, 'aarch64-unknown-linux')
        env:
          MODULE: ${{ inputs.module }}
          TARGET: ${{ matrix.target }}
          LUA_TOOL: ${{ matrix.lua == 'luajit' && inputs.luajit-tool || inputs.lua54-tool }}
          LUA_BIN: ${{ matrix.lua == 'luajit' && 'luajit' || 'lua' }}
          MISE_EXPERIMENTAL: "1"
        run: |
          ext=so
          run=(mise exec "$LUA_TOOL" -- "$LUA_BIN")
          # Windows: setup-lua's interpreter, on PATH.
          case "$TARGET" in *windows*) ext=dll; run=("$LUA_BIN") ;; esac
          EXT=$ext "${run[@]}" -e 'package.cpath = "dist/lib/?." .. os.getenv("EXT") .. ";" .. package.cpath
          local m = require(os.getenv("MODULE"))
          assert(type(m) == "table", "the module is not a table")
          print(os.getenv("MODULE") .. " " .. tostring(m.version) .. " on " .. _VERSION)'
      - name: Pack
        env:
          TARGET: ${{ matrix.target }}
          LUA: ${{ matrix.lua }}
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        run: tar -czf "$MODULE-$VERSION-$LUA-$TARGET.tar.gz" -C dist lib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rock-${{ matrix.target }}-${{ matrix.lua }}
          path: "*.tar.gz"
          if-no-files-found: error

  # The cross-built aarch64 Linux modules, loaded on an ARM runner.
  load-linux-arm:
    name: load (aarch64-unknown-linux-gnu, ${{ matrix.lua }})
    if: contains(inputs.targets, 'aarch64-unknown-linux-gnu')
    needs: module
    strategy:
      fail-fast: false
      matrix:
        lua: ${{ fromJSON(inputs.lua-versions) }}
    runs-on: ubuntu-24.04-arm
    permissions: {}
    steps:
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Tag builds call this workflow: no cache (cache poisoning).
          cache: false
          install: false
      - name: Install Lua
        env:
          LUA_TOOL: ${{ matrix.lua == 'luajit' && inputs.luajit-tool || inputs.lua54-tool }}
          MISE_EXPERIMENTAL: "1"
        run: mise install "$LUA_TOOL"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rock-aarch64-unknown-linux-gnu-${{ matrix.lua }}
          path: rocks
      - name: Load the module
        env:
          MODULE: ${{ inputs.module }}
          LUA_TOOL: ${{ matrix.lua == 'luajit' && inputs.luajit-tool || inputs.lua54-tool }}
          LUA_BIN: ${{ matrix.lua == 'luajit' && 'luajit' || 'lua' }}
          MISE_EXPERIMENTAL: "1"
        run: |
          mkdir dist
          tar -xzf rocks/*.tar.gz -C dist
          mise exec "$LUA_TOOL" -- "$LUA_BIN" -e 'package.cpath = "dist/lib/?.so;" .. package.cpath
          local m = require(os.getenv("MODULE"))
          assert(type(m) == "table", "the module is not a table")
          print(os.getenv("MODULE") .. " " .. tostring(m.version) .. " on " .. _VERSION)'

  # The rockspec as LuaRocks will see it, with the archives' checksums.
  rockspec:
    needs: [module, load-linux-arm]
    # load-linux-arm is skipped when aarch64 Linux is not a target.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: lsdocs/.github/.github/setup-repo@main
        with:
          mise-install-args: cargo:nur
      # Lua with LuaRocks, from mise.
      - name: Install Lua
        env:
          LUA_TOOL: ${{ inputs.lua54-tool }}
        run: mise install "$LUA_TOOL"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rock-*
          path: rocks
          merge-multiple: true
      - name: Write the rockspec
        id: write
        working-directory: ${{ inputs.working-directory }}
        env:
          TEMPLATE: ${{ inputs.rockspec }}
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
          ROCKS: ${{ github.workspace }}/rocks
        run: |
          package=$(sed -n 's/^package = "\(.*\)"/\1/p' "$TEMPLATE")
          out="$package-$VERSION-1.rockspec"
          (cd "$ROCKS" && sha256sum -- *.tar.gz) > SHA256SUMS
          # <hash>  <module>-<version>-<lua>-<target>.tar.gz
          #   -> ["<lua>-<target>"] = "<hash>",
          prefix="$MODULE-$VERSION-"
          while read -r hash file; do
            key=${file#"$prefix"}
            key=${key%.tar.gz}
            printf '    ["%s"] = "%s",\n' "$key" "$hash"
          done < SHA256SUMS > sha256.lua
          awk -v version="$VERSION" '
            /^@SHA256@$/ { while ((getline line < "sha256.lua") > 0) print line; next }
            { gsub(/@VERSION@/, version); print }
          ' "$TEMPLATE" > "$out"
          rm sha256.lua
          echo "path=$out" >> "$GITHUB_OUTPUT"
          cat "$out" SHA256SUMS
      - name: Lint the rockspec
        working-directory: ${{ inputs.working-directory }}
        env:
          ROCKSPEC: ${{ steps.write.outputs.path }}
          LUA_TOOL: ${{ inputs.lua54-tool }}
        run: mise exec "$LUA_TOOL" -- luarocks lint "$ROCKSPEC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rockspec
          path: |
            ${{ inputs.working-directory }}/${{ steps.write.outputs.path }}
            ${{ inputs.working-directory }}/SHA256SUMS
          if-no-files-found: error

  # The rockspec installed with luarocks-build-lsdocs-prebuilt, its URL
  # pointed at the downloaded archives (file://): the prebuilt module in
  # Lua 5.4 and LuaJIT, and a source build (LSDOCS_PREBUILT=0). Ubuntu's
  # Lua, LuaJIT and LuaRocks (an older LuaRocks than mise's, on purpose).
  install:
    name: install (${{ matrix.lua }}, ${{ matrix.from }})
    needs: rockspec
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lua: lua54, from: prebuilt }
          - { lua: luajit, from: prebuilt }
          - { lua: lua54, from: source }
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: lsdocs/.github/.github/setup-repo@main
        with:
          mise-install-args: cargo:nur
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lsdocs/.github
          ref: ${{ inputs.backend-ref }}
          path: .lsdocs-github
          persist-credentials: false
      - name: Install Lua, LuaJIT and LuaRocks
        run: >-
          sudo apt-get install -y --no-install-recommends
          lua5.4 liblua5.4-dev luajit libluajit-5.1-dev luarocks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rock-*
          path: rocks
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rockspec
          path: rockspec
      - name: Configure LuaRocks
        env:
          LUA: ${{ matrix.lua }}
        run: |
          if [ "$LUA" = luajit ]; then
            cat > luarocks-config.lua <<'CFG'
          lua_version = "5.1"
          variables = { LUA = "/usr/bin/luajit", LUA_BINDIR = "/usr/bin", LUA_INCDIR = "/usr/include/luajit-2.1" }
          CFG
            echo "LUA_VERSION=5.1" >> "$GITHUB_ENV"
          else
            cat > luarocks-config.lua <<'CFG'
          lua_version = "5.4"
          variables = { LUA = "/usr/bin/lua5.4", LUA_BINDIR = "/usr/bin", LUA_INCDIR = "/usr/include/lua5.4" }
          CFG
            echo "LUA_VERSION=5.4" >> "$GITHUB_ENV"
          fi
          # LuaRocks loads build backends only from its rocks_trees.
          echo "rocks_trees = { { name = \"test\", root = \"$PWD/.rocks\" } }" >> luarocks-config.lua
          echo "LUAROCKS_CONFIG=$PWD/luarocks-config.lua" >> "$GITHUB_ENV"
      - name: Install the backend
        run: |
          luarocks --lua-version "$LUA_VERSION" --tree .rocks install luarocks-build-rust-mlua
          (cd .lsdocs-github && luarocks --lua-version "$LUA_VERSION" --tree ../.rocks make \
            luarocks-build-lsdocs-prebuilt/luarocks-build-lsdocs-prebuilt-dev-1.rockspec)
      # `make`: the source is this checkout (the tag may not exist yet).
      - name: Install the rockspec
        env:
          FROM: ${{ matrix.from }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # Same file name: LuaRocks wants <package>-<version>-<rev>.rockspec.
          rockspec=$(basename rockspec/*.rockspec)
          sed "s|^  url = \"https://github.com/.*/releases/download/.*\",|  url = \"file://$PWD/rocks\",|" \
            "rockspec/$rockspec" > "$WORKDIR/$rockspec"
          grep -q "file://" "$WORKDIR/$rockspec"
          if [ "$FROM" = source ]; then export LSDOCS_PREBUILT=0; fi
          (cd "$WORKDIR" && luarocks --lua-version "$LUA_VERSION" --tree "$GITHUB_WORKSPACE/.rocks" \
            make "$rockspec") | tee install.log
          if [ "$FROM" = source ]; then
            grep -q "from source" install.log
          else
            grep -q "Installed the prebuilt" install.log
          fi
      - name: Load the installed module
        env:
          MODULE: ${{ inputs.module }}
          LUA: ${{ matrix.lua }}
        run: |
          eval "$(luarocks --lua-version "$LUA_VERSION" --tree .rocks path)"
          bin=$([ "$LUA" = luajit ] && echo luajit || echo lua5.4)
          "$bin" -e 'local m = require(os.getenv("MODULE"))
          assert(type(m) == "table", "the module is not a table")
          print(os.getenv("MODULE") .. " " .. tostring(m.version) .. " on " .. _VERSION)'
